<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>CodePortal Pixel Studio</title>


<style>

#rotateMessage{

position:fixed;
inset:0;
z-index:9999;

display:flex;
align-items:center;
justify-content:center;

text-align:center;

font-size:22px;
font-weight:bold;

line-height:2;

background:
linear-gradient(135deg,#020617,#1e3a8a);

color:white;

padding:30px;

transition:1s;

}


#rotateMessage.hide{

opacity:0;

pointer-events:none;

}



*{

margin:0;
padding:0;

box-sizing:border-box;

font-family:tahoma;

-webkit-tap-highlight-color:transparent;

}



html,body{

width:100%;
height:100%;

overflow:hidden;

background:

radial-gradient(circle at top,#1e3a8a,#020617);

color:white;

touch-action:none;

}



body{

display:flex;

align-items:center;

justify-content:center;

}




#app{

width:100vw;

height:100vh;

display:flex;

flex-direction:row;

align-items:center;

justify-content:space-between;

padding:15px;

gap:15px;

}





.panel{

height:95vh;

width:230px;

background:

rgba(255,255,255,.08);

backdrop-filter:blur(18px);

-webkit-backdrop-filter:blur(18px);

border:

1px solid rgba(255,255,255,.15);

border-radius:25px;

padding:15px;

display:flex;

flex-direction:column;

gap:12px;

overflow-y:auto;

box-shadow:

0 0 40px rgba(0,0,0,.45);

}





.title{

font-size:20px;

font-weight:bold;

text-align:center;

padding:10px;

}




.section{

background:

rgba(255,255,255,.06);

border-radius:18px;

padding:10px;

}





button,
select{

width:100%;

padding:12px;

border:none;

border-radius:15px;

font-size:15px;

color:white;

background:

rgba(255,255,255,.12);

cursor:pointer;

transition:.25s;

}



button:hover{

background:#2563eb;

transform:scale(1.03);

}




#palette{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:10px;

}



.color{

width:100%;

aspect-ratio:1;

border-radius:12px;

cursor:pointer;

border:

3px solid transparent;

transition:.2s;

}



.color.active{

border-color:white;

transform:scale(1.15);

}





#canvasArea{

flex:1;

height:100%;

display:flex;

align-items:center;

justify-content:center;

}





#pixelCanvas{

display:grid;

background:white;

border-radius:15px;

overflow:hidden;

box-shadow:

0 0 50px rgba(0,0,0,.7);

}




.pixel{

background:white;

border:

1px solid #ddd;

}





.codeportal{

margin-top:auto;

background:

linear-gradient(135deg,#2563eb,#9333ea);

font-weight:bold;

font-size:16px;

}





.history{

background:

linear-gradient(135deg,#059669,#10b981);

}





.fill{

background:

linear-gradient(135deg,#f59e0b,#ef4444);

}




@media(max-width:900px){



#app{

padding:8px;

gap:8px;

}



.panel{

width:120px;

height:96vh;

padding:8px;

border-radius:18px;

}



.title{

font-size:13px;

}



button,
select{

font-size:11px;

padding:10px 5px;

}



#palette{

grid-template-columns:repeat(2,1fr);

}



}



</style>

</head>



<body>



<div id="app">



<div class="panel">



<div class="title">

🎨 رنگ‌ها

</div>


<div class="section">

<div id="palette"></div>

</div>


</div>






<div id="canvasArea">


<div id="pixelCanvas"></div>


</div>






<div class="panel">



<div class="title">

🛠 ابزار

</div>



<div class="section">


<select id="gridSize">


<option value="16">

16 × 16

</option>


<option value="32" selected>

32 × 32

</option>


<option value="64">

64 × 64

</option>


</select>


</div>





<button id="penBtn">

✏ قلم

</button>



<button id="eraserBtn">

🩹 پاک‌کن

</button>



<button id="pickerBtn">

💉 قطره‌چکان

</button>



<button id="fillBtn" class="fill">

🪣 سطل رنگ

</button>




<button id="gridBtn">

📐 Grid

</button>





<button id="undoBtn" class="history">

↩ Undo

</button>



<button id="redoBtn" class="history">

↪ Redo

</button>





<button id="clearBtn">

🗑 پاک کردن

</button>




<button id="downloadBtn">

📥 دانلود PNG

</button>





<a href="https://codeportal-git.github.io/link-manager/" target="_blank">


<button class="codeportal">

سایت های بیشتر در: 🚀 CodePortal

</button>


</a>




</div>




</div>



<div id="rotateMessage">

📱 لطفا چرخش صفحه را روشن کنید و<br><br>

گوشی را به حالت افقی بگیرید

</div>

<script>


const canvas=document.getElementById("pixelCanvas");

const palette=document.getElementById("palette");

const gridSize=document.getElementById("gridSize");



let size=32;

let pixels=[];

let currentColor="#000000";

let drawing=false;

let tool="pen";

let showGrid=true;



// تاریخچه

let undoStack=[];

let redoStack=[];



const colors=[


"#000000",
"#ffffff",
"#ef4444",
"#f97316",
"#eab308",

"#22c55e",
"#06b6d4",
"#3b82f6",
"#8b5cf6",
"#ec4899",

"#7c2d12",
"#78350f",
"#365314",
"#166534",
"#155e75",

"#1d4ed8",
"#4338ca",
"#7e22ce",
"#be185d",
"#9f1239",

"#9ca3af",
"#6b7280",
"#4b5563",
"#1f2937",
"#fca5a5",

"#fdba74",
"#fde047",
"#86efac",
"#67e8f9",
"#c4b5fd"

];





createPalette();

createGrid(size);





function createPalette(){


palette.innerHTML="";


colors.forEach(c=>{


let div=document.createElement("div");


div.className="color";


div.style.background=c;



if(c===currentColor)

div.classList.add("active");



div.onclick=()=>{


document.querySelectorAll(".color")

.forEach(x=>x.classList.remove("active"));



div.classList.add("active");


currentColor=c;


};


palette.appendChild(div);


});


}









function createGrid(n){


size=n;


canvas.innerHTML="";


canvas.style.gridTemplateColumns=

`repeat(${n},1fr)`;


canvas.style.gridTemplateRows=

`repeat(${n},1fr)`;



pixels=[];



let side;



if(window.innerWidth>900){


side=Math.min(

window.innerWidth-520,

window.innerHeight-50

);


}else{


side=Math.min(

window.innerWidth-260,

window.innerHeight-40

);


}



canvas.style.width=side+"px";

canvas.style.height=side+"px";





for(let i=0;i<n*n;i++){


let p=document.createElement("div");


p.className="pixel";


p.dataset.color="#ffffff";

p.style.background="#ffffff";



pixels.push(p);


canvas.appendChild(p);


}



attachEvents();


}









function attachEvents(){


pixels.forEach(p=>{


p.onmousedown=()=>{


drawing=true;

paint(p);


};



p.onmouseenter=()=>{


if(drawing)

paint(p);


};




p.ontouchstart=e=>{


e.preventDefault();

drawing=true;

paint(p);


};



});


}







document.addEventListener(

"mouseup",

()=>{


drawing=false;

saveState();

}

);



document.addEventListener(

"touchend",

()=>{


drawing=false;

saveState();

}

);







canvas.addEventListener(

"touchmove",

e=>{


e.preventDefault();


if(!drawing)return;



let t=e.touches[0];


let element=document.elementFromPoint(

t.clientX,

t.clientY

);



if(element && element.classList.contains("pixel"))

paint(element);



}

);









function paint(p){



if(tool==="pen"){


saveBeforeAction();


p.style.background=currentColor;


p.dataset.color=currentColor;


}



else if(tool==="eraser"){


saveBeforeAction();


p.style.background="#ffffff";


p.dataset.color="#ffffff";


}




else if(tool==="picker"){


currentColor=p.dataset.color;


tool="pen";


updatePalette();


}






else if(tool==="fill"){


saveBeforeAction();


floodFill(

p,

p.dataset.color,

currentColor

);


}



}










// سطل رنگ


function floodFill(start,target,newColor){


if(target===newColor)

return;



let stack=[start];



while(stack.length){



let p=stack.pop();



if(!p)

continue;



if(p.dataset.color!==target)

continue;




p.dataset.color=newColor;

p.style.background=newColor;




let index=pixels.indexOf(p);


let x=index%size;

let y=Math.floor(index/size);





let around=[


[y-1,x],

[y+1,x],

[y,x-1],

[y,x+1]


];





around.forEach(a=>{


let ny=a[0];

let nx=a[1];



if(nx>=0 && nx<size && ny>=0 && ny<size){


let next=pixels[ny*size+nx];


if(next.dataset.color===target)

stack.push(next);



}



});



}



}









function updatePalette(){



document.querySelectorAll(".color")

.forEach(x=>{


x.classList.remove("active");


if(x.style.background===currentColor)

x.classList.add("active");


});


}








// ذخیره Undo


function saveBeforeAction(){


undoStack.push(

JSON.stringify(

pixels.map(p=>p.dataset.color)

)

);


if(undoStack.length>50)

undoStack.shift();



redoStack=[];


}






function restore(data){


let arr=JSON.parse(data);



pixels.forEach((p,i)=>{


p.dataset.color=arr[i];

p.style.background=arr[i];


});


}







// Undo


document.getElementById("undoBtn").onclick=()=>{


if(!undoStack.length)

return;



redoStack.push(

JSON.stringify(

pixels.map(p=>p.dataset.color)

)

);



restore(

undoStack.pop()

);



};







// Redo


document.getElementById("redoBtn").onclick=()=>{


if(!redoStack.length)

return;



undoStack.push(

JSON.stringify(

pixels.map(p=>p.dataset.color)

)

);



restore(

redoStack.pop()

);



};









// ابزارها


document.getElementById("penBtn").onclick=()=>tool="pen";


document.getElementById("eraserBtn").onclick=()=>tool="eraser";


document.getElementById("pickerBtn").onclick=()=>tool="picker";


document.getElementById("fillBtn").onclick=()=>tool="fill";







gridSize.onchange=()=>{


createGrid(

Number(gridSize.value)

);


};







document.getElementById("gridBtn").onclick=()=>{


showGrid=!showGrid;



pixels.forEach(p=>{


p.style.border=

showGrid ?

"1px solid #ddd":

"none";


});


};






document.getElementById("clearBtn").onclick=()=>{


saveBeforeAction();



if(confirm("بوم پاک شود؟")){


pixels.forEach(p=>{


p.style.background="#ffffff";

p.dataset.color="#ffffff";


});


}



};





window.onresize=()=>{


createGrid(size);


};




// ===============================
// دانلود PNG
// ===============================


document.getElementById("downloadBtn").onclick=()=>{


let exportCanvas=document.createElement("canvas");


exportCanvas.width=size;

exportCanvas.height=size;



let ctx=exportCanvas.getContext("2d");



pixels.forEach((p,index)=>{


let x=index%size;

let y=Math.floor(index/size);



ctx.fillStyle=p.dataset.color;


ctx.fillRect(

x,

y,

1,

1

);



});





let link=document.createElement("a");


link.download="CodePortal-Pixel-Art.png";


link.href=exportCanvas.toDataURL();


link.click();



};







// ===============================
// ذخیره خودکار پروژه
// ===============================



function saveProject(){



let data={


size:size,


pixels:pixels.map(p=>p.dataset.color)



};




localStorage.setItem(

"CodePortalPixelStudio",

JSON.stringify(data)

);



}







function loadProject(){



let saved=localStorage.getItem(

"CodePortalPixelStudio"

);



if(!saved)

return;



let data=JSON.parse(saved);





if(data.size!==size)

return;





pixels.forEach((p,i)=>{


if(data.pixels[i]){


p.dataset.color=data.pixels[i];


p.style.background=data.pixels[i];


}



});



}









// ذخیره بعد از هر تغییر


setInterval(()=>{


saveProject();



},2000);





// بارگذاری پروژه قبلی


loadProject();









// ===============================
// جلوگیری از زوم موبایل
// ===============================



document.addEventListener(

"gesturestart",

e=>{


e.preventDefault();



}

);









// ===============================
// انیمیشن CodePortal
// ===============================



const cp=document.querySelector(".codeportal");



setInterval(()=>{



cp.style.boxShadow=

"0 0 25px rgba(59,130,246,.8)";




setTimeout(()=>{


cp.style.boxShadow="none";



},500);



},1500);









// ===============================
// پیام چرخش صفحه
// ===============================



window.addEventListener("load",()=>{



let msg=document.getElementById("rotateMessage");



setTimeout(()=>{


msg.classList.add("hide");



setTimeout(()=>{


msg.remove();



},1000);




},5000);



});



</script>


</body>

</html>
