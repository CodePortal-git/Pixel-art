<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
CodePortal Pixel Studio
</title>


<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;

}


body{

height:100vh;

display:flex;

align-items:center;

justify-content:center;

background:

radial-gradient(circle at top,#2563eb,#020617);

color:white;

overflow:hidden;

}



body::before{

content:"";

position:absolute;

width:500px;

height:500px;

background:#9333ea;

filter:blur(150px);

opacity:.4;

}



.container{

position:relative;

width:420px;

max-width:90%;

padding:40px;

border-radius:35px;

background:

rgba(255,255,255,.1);

backdrop-filter:blur(25px);

-webkit-backdrop-filter:blur(25px);

border:

1px solid rgba(255,255,255,.2);

box-shadow:

0 0 50px rgba(0,0,0,.5);

text-align:center;

}



.logo{

font-size:60px;

margin-bottom:15px;

}



h1{

font-size:30px;

margin-bottom:10px;

}



p{

opacity:.8;

margin-bottom:30px;

line-height:2;

}



button{

width:100%;

padding:18px;

margin-top:15px;

border:none;

border-radius:20px;

font-size:18px;

font-weight:bold;

color:white;

cursor:pointer;

transition:.3s;

}



.mobile{

background:

linear-gradient(135deg,#22c55e,#06b6d4);

}



.desktop{

background:

linear-gradient(135deg,#2563eb,#9333ea);

}



button:hover{

transform:scale(1.05);

box-shadow:

0 0 30px rgba(255,255,255,.3);

}



.auto{

margin-top:25px;

font-size:13px;

opacity:.7;

}



.footer{

margin-top:30px;

font-size:13px;

opacity:.6;

}



</style>

</head>


<body>


<div class="container">


<div class="logo">

🎨

</div>


<h1>

CodePortal Pixel Studio

</h1>


<p>

نسخه مورد نظر خود را انتخاب کنید

<br>

نقاشی پیکسلی حرفه‌ای آنلاین

</p>



<button class="mobile" onclick="openMobile()">

📱 نسخه موبایل

</button>



<button class="desktop" onclick="openDesktop()">

💻 نسخه کامپیوتر

</button>



<div class="auto">

تشخیص خودکار:

<span id="device">

در حال بررسی...

</span>

</div>



<div class="footer">

🚀 Powered by CodePortal

</div>



</div>





<script>


function openMobile(){

location.href="mobile.html";

}



function openDesktop(){

location.href="desktop.html";

}





let device=document.getElementById("device");



if(window.innerWidth<=900){

device.innerHTML="📱 گوشی تشخیص داده شد";

}

else{

device.innerHTML="💻 کامپیوتر تشخیص داده شد";

}



</script>



</body>

</html>
